---
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_XCODEBUILD_FLAGS: >-
    CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual
    DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
  CI_XCBEAUTIFY: xcbeautify --renderer github-actions

jobs:
  scans:
    name: Secret and dependency scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks and OSV-Scanner
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install gitleaks osv-scanner
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: make scan-secrets
        run: make scan-secrets

      - name: make scan-dependencies
        run: make scan-dependencies

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint, actionlint and zizmor
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install yamllint actionlint zizmor
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: make lint-workflows
        run: make lint-workflows

  lint:
    name: Lint
    if: vars.MACOS_CI == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require Swift 6.4
        run: |
          xcodebuild -version
          swift --version 2>&1 | tee /dev/stderr | grep -q "Swift version 6\.4"

      - name: Install SwiftLint, XcodeGen, checkmake and Vale
        run: brew install swiftlint xcodegen checkmake vale

      - name: make check-project
        run: make check-project

      - name: make lint
        run: make lint

      - name: make fmt-check
        run: make fmt-check

  test:
    name: Tests
    if: vars.MACOS_CI == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      TEST_RUNNER_SKIP_SNAPSHOTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require Swift 6.4
        run: |
          xcodebuild -version
          swift --version 2>&1 | tee /dev/stderr | grep -q "Swift version 6\.4"

      - name: Trust package plugins and macros
        run: sh ci_scripts/ci_post_clone.sh

      - name: Install xcbeautify and SwiftLint
        run: brew install xcbeautify swiftlint

      - name: make test-coverage
        run: >-
          make test-coverage XCODEBUILD_LOG=build.noindex/xcodebuild.log
          XCBEAUTIFY="$CI_XCBEAUTIFY" XCODEBUILD_FLAGS="$CI_XCODEBUILD_FLAGS"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: build.noindex/coverage.xcresult.json
          if-no-files-found: ignore

      - name: make check-warnings
        run: make check-warnings XCODEBUILD_LOG=build.noindex/xcodebuild.log

      - name: make lint-analyze-full
        run: make lint-analyze-full COMPILER_LOG=build.noindex/xcodebuild.log

      - name: make test-unit-tsan
        if: github.event_name == 'pull_request'
        run: >-
          make test-unit-tsan
          XCBEAUTIFY="$CI_XCBEAUTIFY" XCODEBUILD_FLAGS="$CI_XCODEBUILD_FLAGS"
