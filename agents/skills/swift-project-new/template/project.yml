name: __SLUG__

options:
  minimumXcodeGenVersion: 2.46.0
  projectFormat: xcode16_0
  xcodeVersion: "27.0"
  settingPresets: none
  developmentLanguage: en
  defaultSourceDirectoryType: syncedFolder

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: xcconfigs/Config.xcconfig
  Release: xcconfigs/Config.xcconfig

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SDKROOT: macosx
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule

settingGroups:
  swiftConcurrency:
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  __SLUG__:
    type: application
    platform: macOS
    sources:
      - path: __SLUG__
    settings:
      groups: [swiftConcurrency]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: __SLUG__/__SLUG__.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: $(APP_COPYRIGHT)
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)$(APP_BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: $(APP_NAME)
        SWIFT_EMIT_LOC_STRINGS: YES

  __SLUG__Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: __SLUG__Tests
    dependencies:
      - target: __SLUG__
    settings:
      groups: [swiftConcurrency]
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)Tests
        PRODUCT_NAME: $(TARGET_NAME)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_NAME).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/$(APP_NAME)

schemes:
  __SLUG__:
    build:
      targets:
        __SLUG__: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: __SLUG__Tests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
